# Intégration continue : tests, porte de qualité, puis construction et publication de l'image.
#
# L'ordre n'est pas décoratif. La porte de qualité s'exécute AVANT le build : publier une
# image dont le modèle s'est dégradé serait pire que ne rien publier, car elle partirait
# en production sans que personne ne s'en aperçoive.
#
# Deux secrets de dépôt sont requis pour le job `docker` :
#   DAGSHUB_USER   nom d'utilisateur DagsHub
#   DAGSHUB_TOKEN  jeton personnel DagsHub
# Ils servent à récupérer le modèle, suivi par DVC et absent de git. Sans eux, ce job
# échoue explicitement plutôt que de construire une image sans modèle.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  PR_AUC_MIN: "0.54"
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------- 1. tests
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances
        # requirements-test.txt et non requirements.txt : les tests ne touchent ni aux
        # modèles profonds, ni à MLflow, ni à DVC. Installer PyTorch coûterait plusieurs
        # minutes et ~2 Go pour du code que la suite n'exécute pas.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install "dvc[http]"

      - name: Récupérer données et modèle (DVC)
        # Les tests portant sur les données et le service sont automatiquement ignorés
        # si les artefacts sont absents ; `continue-on-error` évite de bloquer une PR
        # externe qui n'a pas accès aux secrets, tout en exécutant ce qui est testable.
        continue-on-error: true
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -n "$DAGSHUB_TOKEN" ]; then
            dvc remote modify dagshub --local user "$DAGSHUB_USER"
            dvc remote modify dagshub --local password "$DAGSHUB_TOKEN"
            dvc pull --allow-missing
          else
            echo "::warning::Secrets DVC absents — les tests nécessitant données ou modèle seront ignorés"
          fi

      - name: pytest
        run: pytest tests/ -v --tb=short --junitxml=report.xml

      - name: Vérifier qu'au moins un test s'est réellement exécuté
        # Sans ce contrôle, un job vert peut ne rien avoir vérifié : les tests qui
        # dépendent des données ou du modèle s'ignorent d'eux-mêmes quand ces artefacts
        # sont absents, et pytest sort alors en succès. Un feu vert vide est pire qu'un
        # feu rouge, puisqu'il inspire une confiance infondée.
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("report.xml").getroot().find("testsuite")
          total = int(suite.get("tests", 0))
          ignores = int(suite.get("skipped", 0))
          executes = total - ignores
          print(f"{executes} test(s) exécuté(s), {ignores} ignoré(s) sur {total}")
          if executes == 0:
              print("::error::Aucun test n'a été exécuté — job vert sans vérification réelle")
              sys.exit(1)
          if ignores:
              print(f"::warning::{ignores} test(s) ignorés faute de données ou de modèle. "
                    "Configurer DAGSHUB_USER et DAGSHUB_TOKEN pour exécuter la suite complète.")
          PY

  # ---------------------------------------------------------------- 2. porte de qualité
  quality-gate:
    name: Porte de qualité (PR-AUC)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que la PR-AUC dépasse le seuil
        run: |
          if [ ! -f metrics/scores.json ]; then
            echo "::error::metrics/scores.json absent — lancer scripts/final_eval.py et committer le résultat"
            exit 1
          fi

          PR_AUC=$(python -c "import json; print(json.load(open('metrics/scores.json'))['pr_auc'])")
          echo "PR-AUC mesurée : $PR_AUC"
          echo "Seuil requis   : $PR_AUC_MIN"

          if python -c "import sys; sys.exit(0 if $PR_AUC > $PR_AUC_MIN else 1)"; then
            echo "::notice::Porte de qualité franchie ($PR_AUC > $PR_AUC_MIN)"
            echo "### Porte de qualité franchie" >> $GITHUB_STEP_SUMMARY
            echo "PR-AUC **$PR_AUC** > seuil **$PR_AUC_MIN**" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Modèle dégradé : PR-AUC $PR_AUC <= $PR_AUC_MIN — déploiement annulé"
            echo "### Porte de qualité ÉCHOUÉE" >> $GITHUB_STEP_SUMMARY
            echo "PR-AUC **$PR_AUC** <= seuil **$PR_AUC_MIN**. Aucune image ne sera publiée." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ---------------------------------------------------------------- 3. build et publication
  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    # `needs` fait toute la garantie demandée : si la porte de qualité échoue, ce job
    # n'est jamais lancé et rien n'est publié.
    needs: quality-gate
    # Une pull request construit l'image pour vérifier que le Dockerfile tient, mais ne
    # publie rien : seuls les pushs sur main alimentent le registre.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Récupérer le modèle (DVC)
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -z "$DAGSHUB_TOKEN" ]; then
            echo "::error::Secrets DAGSHUB_USER et DAGSHUB_TOKEN requis pour récupérer le modèle"
            exit 1
          fi
          pip install "dvc[http]"
          dvc remote modify dagshub --local user "$DAGSHUB_USER"
          dvc remote modify dagshub --local password "$DAGSHUB_TOKEN"
          dvc pull models/final_model.joblib models/model_card.json

      - name: Vérifier que le modèle est bien présent
        # Sans ce contrôle, le COPY du Dockerfile échouerait avec un message obscur.
        run: |
          test -f models/final_model.joblib || { echo "::error::modèle absent après dvc pull"; exit 1; }
          test -f models/model_card.json    || { echo "::error::carte du modèle absente"; exit 1; }
          ls -lh models/

      - uses: docker/setup-buildx-action@v3

      - name: Authentification au registre GitHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérifier que l'image répond
        # Publier une image qui ne démarre pas serait un faux succès : on la relance et
        # on interroge /health avant de considérer le déploiement réussi.
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name verif -p 8000:8000 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | tee /tmp/health.json
          python -c "import json; d=json.load(open('/tmp/health.json')); assert d['status']=='ok', d; print('service opérationnel')"
          docker rm -f verif

      - name: Résumé
        run: |
          echo "### Image publiée" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------- 4. déploiement
  deploy:
    name: Déploiement Render
    runs-on: ubuntu-latest
    needs: docker
    # Trois conditions cumulées : uniquement sur main, uniquement sur un push (jamais
    # depuis une pull request), et uniquement si le déploiement a été activé via la
    # variable de dépôt RENDER_ENABLED. Sans ce drapeau le job apparaît « skipped »,
    # ce qui est honnête — plutôt qu'un « success » vert alors que rien n'a été déployé.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RENDER_ENABLED == 'true'
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Vérifier la configuration
        env:
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          manquants=""
          [ -z "$API_KEY" ]    && manquants="$manquants RENDER_API_KEY"
          [ -z "$SERVICE_ID" ] && manquants="$manquants RENDER_SERVICE_ID"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets manquants :$manquants — voir la section Déploiement du README"
            exit 1
          fi

      - name: Déclencher le déploiement
        id: trigger
        env:
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          reponse=$(curl -sS -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')

          deploy_id=$(echo "$reponse" | jq -r '.id // empty')
          if [ -z "$deploy_id" ]; then
            # On n'affiche que le message d'erreur renvoyé par Render : la réponse brute
            # pourrait contenir des éléments de configuration qu'on ne veut pas journaliser.
            echo "::error::Render n'a pas retourné d'identifiant de déploiement : $(echo "$reponse" | jq -r '.message // "réponse inattendue"')"
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> $GITHUB_OUTPUT
          echo "Déploiement déclenché : $deploy_id"

      - name: Attendre la fin du déploiement
        # Un POST sur l'API rend la main immédiatement : sans cette attente, le job
        # signalerait un succès alors que la construction côté Render peut encore échouer.
        env:
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          echeance=$((SECONDS + 900))          # 15 minutes
          while [ $SECONDS -lt $echeance ]; do
            statut=$(curl -sS \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $API_KEY" | jq -r '.status // "unknown"')
            echo "  statut : $statut"

            case "$statut" in
              live)
                echo "::notice::Déploiement terminé avec succès"
                exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Déploiement en échec (statut : $statut)"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Délai dépassé — le déploiement n'a pas abouti en 15 minutes"
          exit 1

      - name: Vérifier que le service déployé répond
        # Dernier maillon : un déploiement « live » côté Render ne garantit pas que
        # l'application répond correctement. On interroge /health sur l'URL publique.
        if: vars.RENDER_SERVICE_URL != ''
        run: |
          url="${{ vars.RENDER_SERVICE_URL }}"
          for i in $(seq 1 20); do
            if curl -sf "$url/health" -o sante.json; then
              cat sante.json
              python -c "import json,sys; d=json.load(open('sante.json')); assert d['status']=='ok', d; print('service en ligne :', d['model_name'])"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Le service déployé ne répond pas sur $url/health"
          exit 1

      - name: Résumé
        run: |
          echo "### Déploiement Render" >> $GITHUB_STEP_SUMMARY
          echo "- Déploiement : \`${{ steps.trigger.outputs.deploy_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image : \`${{ env.REGISTRY }}/${{ github.repository }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL : ${{ vars.RENDER_SERVICE_URL }}" >> $GITHUB_STEP_SUMMARY
